services:
  - type: web
    name: neurox-ai-backend
    runtime: node
    rootDir: backend
    plan: starter
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false          # Optional: free-tier web search; never expose in frontend
      - key: AI_PROVIDER_ORDER
        value: gemini,groq,openrouter
      - key: ALLOWED_ORIGINS
        value: https://neuroaii.netlify.app
