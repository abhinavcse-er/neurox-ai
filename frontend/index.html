<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeuroX AI | Abhinav Kumar</title>

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!-- Highlight.js -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>

  <!-- Marked (Markdown parser) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Main CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Background Particles -->
  <div id="particles-js"></div>

  <!-- Top Bar -->
  <header class="top-bar">
    <div class="logo">NeuroX AI</div>

    <div class="profile-area">
      <button class="login-btn" id="loginBtn" onclick="window.location.href='login.html'">
        Click here to Login
      </button>

      <div class="profile-circle" id="profileBtn">U</div>
      <div class="profile-dropdown" id="profileDropdown">
        <p id="userEmail"></p>
        <button id="logoutBtn">Logout</button>
      </div>
    </div>
  </header>

  <!-- MAIN WRAPPER -->
  <div class="main-wrapper">
    <div class="container glass">

      <!-- Chat Header -->
      <header class="chat-header">
        <div class="logo">
          <span class="material-icons bot-icon">smart_toy</span>
          <h2>NeuroX AI</h2>
          <span class="model-badge">Gemini 2.5 Flash</span>
        </div>

        <div class="buttons">
          <span class="material-icons icon-btn" id="fullscreen-btn">fullscreen</span>
          <span class="material-icons icon-btn" id="theme-btn">dark_mode</span>
          <span class="material-icons icon-btn" id="delete-btn">delete</span>
        </div>
      </header>

      <!-- Chat Messages -->
      <ul class="chat-list"></ul>

      <!-- Suggestions -->
      <div class="suggestions">
        <button>Explain JavaScript</button>
        <button>Write Python code</button>
        <button>Best engineering colleges in India</button>
      </div>

      <!-- Input Area -->
      <div class="input-area glass-light">
        <input type="file" id="file-input" hidden accept="image/*">

        <button id="file-btn" class="file-btn">
          <span class="material-icons">attach_file</span>
        </button>

        <button id="mic-btn" class="file-btn">
          <span class="material-icons">mic</span>
        </button>

        <textarea placeholder="Type your message..."></textarea>

        <button id="send-btn" class="send-btn">
          <span class="material-icons">send</span>
        </button>
      </div>

    </div>
  </div>

  <!-- Sticky Footer -->
  <footer class="footer">
    <div class="footer-content">

      <div class="footer-left">
        © <span id="year"></span> Abhinav Kumar. All Rights Reserved.
      </div>

      <div class="footer-center">
        <span id="liveTime"></span>
      </div>

      <div class="footer-right">
        <a href="https://github.com/abhinavcse-er" target="_blank">
          <i class="fab fa-github"></i> abhinavcse-er
        </a>
      </div>

    </div>
  </footer>

  <!-- Scripts -->
  <script type="module" src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/particles.js"></script>

</body>

</html>
